<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rizvi College of Engineering — First Year Engineering Assignment Portal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css">
  <!-- Google Identity Services (OAuth 2.0) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">R</div>
      <div>
        <div class="brand-title">Rizvi College of Engineering</div>
        <div class="brand-subtitle">First Year Engineering (FE) Assignment & Lab Portal</div>
      </div>
    </div>

    <div class="header-controls">
      <div id="role-switcher-container"></div>
      <div id="active-user-badge" class="active-user-badge"></div>
    </div>
  </header>

  <!-- App Main Content Container -->
  <div class="app-container">
    <!-- Left Navigation Sidebar -->
    <nav id="sidebar-nav" class="sidebar-nav print-hide"></nav>

    <!-- Main View Container -->
    <main id="main-content" class="main-content"></main>
  </div>

  <!-- Scripts -->
  <script src="./js/data.js"></script>
  <script src="./js/adminView.js"></script>
  <script src="./js/facultyView.js"></script>
  <script src="./js/studentView.js"></script>
  <script src="./js/analyticsView.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
