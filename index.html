<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rizvi College of Engineering — First Year Engineering Assignment Portal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Lato:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css?v=2">
  <!-- KaTeX for Natural Math Expression Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- Supabase Cloud JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Identity Services (OAuth 2.0) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Skip to main content for screen readers -->
  <a href="#main-content" class="skip-link print-hide">Skip to main content</a>

  <!-- Top Navigation Header -->
  <header class="app-header" role="banner">
    <div class="brand-container">
      <div class="brand-logo" aria-hidden="true">R</div>
      <div>
        <div class="brand-title">Rizvi College of Engineering</div>
        <div class="brand-subtitle">First Year Engineering (FE) Assignment & Lab Portal</div>
      </div>
    </div>

    <div class="header-controls">
      <div id="role-switcher-container"></div>
      <div id="active-user-badge" class="active-user-badge"></div>
    </div>
  </header>

  <!-- App Main Content Container -->
  <div class="app-container">
    <!-- Left Navigation Sidebar -->
    <nav id="sidebar-nav" class="sidebar-nav print-hide" aria-label="Portal Navigation"></nav>

    <!-- Main View Container -->
    <main id="main-content" class="main-content" tabIndex="-1"></main>
  </div>

  <!-- Full-Screen Loading Spinner Overlay -->
  <div id="spinner-overlay" class="spinner-overlay" aria-hidden="true">
    <div class="spinner-card">
      <div class="spinner-icon"></div>
      <div id="spinner-message" class="spinner-message">Loading data…</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/data.js?v=3"></script>
  <script src="./js/adminView.js?v=3"></script>
  <script src="./js/facultyView.js?v=3"></script>
  <script src="./js/studentView.js?v=3"></script>
  <script src="./js/analyticsView.js?v=3"></script>
  <script src="./js/app.js?v=3"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
